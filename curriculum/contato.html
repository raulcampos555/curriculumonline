<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(180deg, #f8fafc, #e2e8f0);
            min-height: 100vh;
        }

        .navbar {
            background: white;
            padding: 18px 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .08);
        }

        .nav-link {
            color: #0d47a1 !important;
            font-weight: 600;
        }

        .nav-link:hover {
            color: #6a00ff !important;
        }

        .btn-voltar {
            text-decoration: none;
            border: 2px solid #6a00ff;
            color: #6a00ff;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: bold;
            transition: .3s;
        }

        .btn-voltar:hover {
            background: #6a00ff;
            color: white;
        }

        .card-formulario {
            max-width: 750px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .1);
        }

        .card-formulario h1 {
            text-align: center;
            color: #0d47a1;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .linha {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .linha input {
            flex: 1;
        }

        .campo,
        textarea,
        input[type="text"],
        input[type="email"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cfd8dc;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #0d1b5e;
            font-weight: bold;
        }

        .notas {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-enviar {
            background: #009c3b;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            font-weight: bold;
            transition: .3s;
        }

        .btn-enviar:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg">

        <div class="container-fluid">

            <div class="d-flex gap-4 fw-bold">

                <a class="nav-link" href="index.html">
                    Home
                </a>

                <a class="nav-link" href="portifolio.html">
                    Portfólio
                </a>

                <a class="nav-link" href="contato.html">
                    Contato
                </a>

            </div>

        </div>

    </nav>
    <div class="container mt-4">

        <a href="index.html" class="btn-voltar">
            VOLTAR
        </a>

    </div>

    <div class="card-formulario">

        <h1>Contato Profissional</h1>

        <form action="https://formsubmit.co/raulricampos@gmail.com" method="POST">

            <!-- CONFIGURAÇÕES DO FORMSUBMIT -->

            <input type="hidden" name="_subject" value="Novo contato recebido pelo Portfólio">

            <input type="hidden" name="_captcha" value="false">

            <div class="linha">

                <input type="text" name="empresa" placeholder="Nome da Empresa" required>

                <input type="text" name="responsavel" placeholder="Nome do Responsável" required>

            </div>

            <input type="email" name="email" placeholder="E-mail Corporativo" class="campo" required>

            <input type="tel" name="telefone" placeholder="Telefone para Contato" class="campo">

            <label>
                Área de Interesse
            </label>

            <select class="campo" name="area">

                <option>Selecione uma opção</option>

                <option>Estágio</option>

                <option>Desenvolvimento Web</option>

                <option>Desenvolvimento Mobile</option>

                <option>Freelancer</option>

                <option>Parceria Profissional</option>

                <option>Outro</option>

            </select>

            <label>
                Assunto
            </label>

            <input type="text" name="assunto" placeholder="Digite o assunto do contato" class="campo">

            <label>
                Mensagem
            </label>

            <textarea rows="6" name="mensagem" placeholder="Escreva sua mensagem aqui..." required></textarea>

            <div class="text-center mt-4">

                <button type="submit" class="btn-enviar">
                    Enviar
                </button>

            </div>

        </form>

    </div>

</body>

</html>
