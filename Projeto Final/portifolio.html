<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfólio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(180deg, #f8fafc, #e2e8f0);
            overflow-x: hidden;
            min-height: 100vh;
        }

        .navbar {
            background: white;
            padding: 18px 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .nav-link {
            color: #0d47a1 !important;
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-link:hover {
            color: #6a00ff !important;
            transform: translateY(-2px);
        }

        .titulo {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 10px;
            color: #0d47a1;
            font-size: 65px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .carousel {
            margin-top: 30px;
        }

        .carousel-inner {
            height: 650px;
        }

        .carousel-item {
            height: 650px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .carousel-item img {
            max-width: 100%;
            max-height: 500px;
            width: auto;
            height: auto;
            object-fit: contain;
            margin: auto;
            display: block;
        }

        .carousel-item img:hover {
            transform: scale(1.02);
        }

        .carousel-control-prev,
        .carousel-control-next {
            width: 8%;
        }

        .carousel-control-prev-icon,
        .carousel-control-next-icon {
            width: 70px;
            height: 70px;
            background-size: cover;

            border-radius: 50%;
            background-color: rgba(13, 71, 161, 0.7);
            padding: 20px;
        }

        .carousel-indicators [data-bs-target] {
            width: 14px;
            height: 14px;

            border-radius: 50%;
            border: none;

            background-color: #94a3b8;
        }

        .carousel-indicators .active {
            background-color: #0d47a1;
        }

        .btn-voltar {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            margin-bottom: 50px;
        }

        .btn-roxo {
            background: linear-gradient(90deg, #0d47a1, #6a00ff);

            color: white;
            text-decoration: none;

            padding: 14px 45px;

            border-radius: 12px;

            font-weight: bold;
            letter-spacing: 1px;

            transition: 0.3s;

            box-shadow: 0 6px 15px rgba(106, 0, 255, 0.3);
        }

        .btn-roxo:hover {
            color: white;
            transform: translateY(-3px);

            box-shadow: 0 10px 20px rgba(106, 0, 255, 0.4);
        }
    </style>
</head>

<body>


    <nav class="navbar navbar-expand-lg">

        <div class="container-fluid">

            <div class="d-flex gap-4 fw-bold">

                <a class="nav-link text-primary" href="index.html">
                    Home
                </a>

                <a class="nav-link text-primary" href="portifolio.html">
                    Portfólio
                </a>

                <a class="nav-link text-primary" href="contato.html">
                    Contato
                </a>

            </div>

        </div>

    </nav>


    <h1 class="titulo">
        Portfólio
    </h1>


    <div class="container-fluid">

        <div id="meuCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel">

            <div class="carousel-indicators">

                <button type="button" data-bs-target="#meuCarousel" data-bs-slide-to="0" class="active"></button>

                <button type="button" data-bs-target="#meuCarousel" data-bs-slide-to="1"></button>

                <button type="button" data-bs-target="#meuCarousel" data-bs-slide-to="2"></button>

                <button type="button" data-bs-target="#meuCarousel" data-bs-slide-to="3"></button>

                <button type="button" data-bs-target="#meuCarousel" data-bs-slide-to="4"></button>

                <button type="button" data-bs-target="#meuCarousel" data-bs-slide-to="5"></button>

                <button type="button" data-bs-target="#meuCarousel" data-bs-slide-to="6"></button>

                <button type="button" data-bs-target="#meuCarousel" data-bs-slide-to="7"></button>

                <button type="button" data-bs-target="#meuCarousel" data-bs-slide-to="8"></button>

            </div>



            <div class="carousel-inner">

                <div class="carousel-item active">
                    <img src="img/imagem1.png" class="d-block" alt="Imagem 1">
                </div>

                <div class="carousel-item">
                    <img src="img/imagem2.png" class="d-block" alt="Imagem 2">
                </div>

                <div class="carousel-item">
                    <img src="img/imagem3.png" class="d-block" alt="Imagem 3">
                </div>

                <div class="carousel-item">
                    <img src="img/imagem4.png" class="d-block" alt="Imagem 4">
                </div>

                <div class="carousel-item">
                    <img src="img/imagem6.png" class="d-block" alt="Imagem 6">
                </div>

                <div class="carousel-item">
                    <img src="img/imagem7.png" class="d-block" alt="Imagem 7">
                </div>

                <div class="carousel-item">
                    <img src="img/imagem9.png" class="d-block" alt="Imagem9">
                </div>

                <div class="carousel-item">
                    <img src="img/imagem10.png" class="d-block" alt="Imagem10">
                </div>

            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#meuCarousel" data-bs-slide="prev">

                <span class="carousel-control-prev-icon"></span>

            </button>

            <button class="carousel-control-next" type="button" data-bs-target="#meuCarousel" data-bs-slide="next">

                <span class="carousel-control-next-icon"></span>

            </button>

        </div>

        <div class="btn-voltar">

            <a href="index.html" class="btn-roxo">
                VOLTAR
            </a>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
